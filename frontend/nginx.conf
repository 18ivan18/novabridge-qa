server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Above the API's 20 MB limit, because multipart adds overhead and because the API's own
        # 413 has the message the UI shows. This cap stops anything far larger from reaching it.
        client_max_body_size 21m;

        # An LLM call can take 60 seconds and be retried once. The default of 60 seconds here
        # would answer with a bare 504 before the API could send its friendly 502.
        proxy_read_timeout 150s;
    }
}
